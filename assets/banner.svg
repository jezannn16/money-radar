      <stop offset="1" stop-color="#272751"/>
    </linearGradient>
    <linearGradient id="money-line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#57d7bb"/>
      <stop offset="1" stop-color="#a7efbe"/>
